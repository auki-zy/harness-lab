id: ask-ride-neutral
title: 我们做了个给夜骑通勤的人用的「骑行路线规划」小网站，现在要一页介绍页，手机上扫码就能看。交付一个自包含的 index.h…
description: 用户自己出的题（A 不给技能 / B 给技能；由 agent_judge 判）

input:
  prompt: |
    我们做了个给夜骑通勤的人用的「骑行路线规划」小网站，现在要一页介绍页，手机上扫码就能看。交付一个自包含的 index.html，放项目根目录，CSS 和 JS 都内联，不装依赖、不跑构建，双击就能打开。页面里要有：顶部导航、一张主视觉、三张功能卡、两档订阅方案对比、一个订阅表单（邮箱填错要当场提示哪里错）、页脚；再加一个明暗主题开关，默认跟着系统走。
    我自己平时主要用键盘操作，手机上也是单手刷，所以别让我非用鼠标才能走完整个流程。
    验收很朴素：手机上打开不出现横向拖动、不破版，电脑上打开也不难看；控制台别报错；切到暗色之后文字还得看得清。

constraints:
  timeout_seconds: 600
  max_turns: 8

expect:
  exit_code: 0

judge:
  type: agent_judge
  model: anthropic/deepseek-v4-flash
  criteria:
    - "只按用户给出的这条任务要求评判：任务里明确要的东西都在，就算做到了；任务没要求的，不许拿来扣分（也别用别的标准）"
    - "产出要能用：交付物在、能跑起来 / 能打开、格式没错；跑不起来、交付物缺失、输出对不上任务要求的格式，才算没做到"
