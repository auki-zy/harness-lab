schema_version: v1alpha1

# 用户自己出的题（由 tools/gen-eval.mjs --from-prompt 生成）。
# A = 只给这段提示词；B = 提示词 + 技能正文（benchmark.enabled 控制）。
# 判分用 LLM 裁判（agent_judge），走内部网关。

environment:
  type: none
  env:
    TZ: UTC

mcp:
  servers: []

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    name: auto

cases:
  files: 
    - evals/cases/ask-202609150802.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 12
    collect_artifacts:
      # 页面也算产物：视觉类技能的"效果"就是那个页面，不收上来台账里根本打不开（踩过：
      # ui-ux-pro-max 两条 ask 记录都只有结论、没有可打开的 A/B 页面）
      - "**/*.html"
      - "**/*.htm"
      - "**/*.css"
      - "**/*.mjs"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.py"
      - "**/*.md"
      - "**/*.txt"
      - "**/*.json"

benchmark:
  enabled: true

judge:
  type: agent_judge
  model: anthropic/deepseek-v4-flash
  criteria:
    - "只按用户给出的这条任务要求评判：任务里明确要的东西都在，就算做到了；任务没要求的，不许拿来扣分（也别用别的标准）"
    - "产出要能用：交付物在、能跑起来 / 能打开、格式没错；跑不起来、交付物缺失、输出对不上任务要求的格式，才算没做到"

report:
  formats: [json, html]
  artifacts: [transcript]
